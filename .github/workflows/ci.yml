name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv venv
      - run: uvx maturin develop -r
      - run: uv pip install pytest
      - run: .venv/bin/python -m pytest

  python-intervals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv venv
      - run: uvx maturin develop -r -E intervals
      - run: uv pip install pytest sympy==1.14.0 mpmath==1.3.0
      - run: .venv/bin/python -m pytest

  satsimp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv venv
      - run: uvx maturin develop -r --extras satsimp
      - run: uv pip install pytest
      - run: .venv/bin/python -m pytest tests/test_satsimp.py

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          build-args: "--wfail"
          use-mathlib-cache: true
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv venv
      - run: uvx maturin develop -r
      - run: .venv/bin/python lean/check_printer.py
