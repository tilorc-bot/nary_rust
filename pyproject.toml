[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "nary_rust"
version = "0.1.0"
requires-python = ">=3.9"

[tool.maturin]
python-source = "python"
module-name = "nary._core"

[tool.mypy]
files = ["python/nary"]
python_version = "3.10"
strict = true
allow_redefinition = true
untyped_calls_exclude = ["nary._identities"]

[[tool.mypy.overrides]]
module = ["nary._identities"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["var-annotated"]
